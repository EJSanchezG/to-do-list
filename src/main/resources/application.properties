spring.application.name=to-do-list

# URL de la base de datos (reemplaza 'todo_db' por el nombre de tu base de datos)
# Usa la variable de Docker, pero si no existe, usa localhost (para cuando corras desde IntelliJ)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/todo_db
spring.datasource.username=postgres
spring.datasource.password=admin

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.developer=Jesus Sanchez
app.version=1.0.0